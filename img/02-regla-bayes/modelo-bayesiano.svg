<svg width="100%" viewBox="0 0 680 204" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="context-stroke" stroke="none"/>
    </marker>
  </defs>

  <!-- Nodo: Distribución a priori -->
  <rect x="30" y="20" width="175" height="52" rx="8" fill="#ff2152" stroke="#ff2152" stroke-width="0.5"/>
  <text x="117" y="46" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#fff">Distribución a priori</text>

  <!-- Nodo: Función de verosimilitud -->
  <rect x="30" y="106" width="175" height="52" rx="8" fill="#ff2152" stroke="#ff2152" stroke-width="0.5"/>
  <text x="117" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#fff">Función de</text>
  <text x="117" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#fff">verosimilitud</text>

  <!-- Flecha: a priori → Regla de Bayes -->
  <path d="M205 46 L248 78" fill="none" stroke="#888" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Flecha: verosimilitud → Regla de Bayes -->
  <path d="M205 132 L248 100" fill="none" stroke="#888" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Nodo central: Regla de Bayes -->
  <rect x="250" y="64" width="175" height="52" rx="8" fill="#0099CC" stroke="#0099CC" stroke-width="0.5"/>
  <text x="337" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Regla de Bayes</text>

  <!-- Flecha: Regla de Bayes → Distribución a posteriori -->
  <line x1="425" y1="90" x2="466" y2="90" stroke="#888" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Nodo: Distribución a posteriori -->
  <rect x="468" y="64" width="182" height="52" rx="8" fill="#03BF3D" stroke="#03BF3D" stroke-width="0.5"/>
  <text x="559" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#fff">Distribución a</text>
  <text x="559" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#fff">posteriori</text>
</svg>
