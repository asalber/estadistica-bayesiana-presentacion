project:
  output-dir: "docs"

lang: es

language:
  callout-tip-title: "Ayuda"
  callout-note-title: "Nota"
  callout-important-title: "Importante"
  callout-warning-title: "Advertencia"
  callout-caution-title: "Precaución"

author: "Alfredo Sánchez Alberca"

execute: 
  echo: true
  cache: true
  freeze: auto

format:
  clean-revealjs:
    theme: [default, custom.scss]
    logo: img/logos/sticker-estadistica-bayesiana-r.png
    navigation-mode: vertical
    slide-level: 3
    # smaller: true
    footer: <https://aprendeconalf.es/estadistica-bayesiana-presentacion/>
    code-line-numbers: false
    highlight-style: atom-one
    callout-appearance: default
    default-image-extension: svg
    #incremental: true
    toc: true
    toc-depth: 1
    chalkboard: true
    menu: true
    slide-number: c/t
    transition: convex
    transition-speed: fast
    template-partials:
      - title-slide.html